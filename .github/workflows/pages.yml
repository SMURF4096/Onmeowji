name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"] # หรือเปลี่ยนเป็น master ถ้าคลังของคุณใช้ชื่อ master

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false # ปิดการโหลด Submodule ที่มีปัญหาเพื่อไม่ให้บิลด์ล่ม
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
